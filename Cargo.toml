[package]
name = "gguff-weight-editor"
version = "0.2.0"
edition = "2021"
description = "A lightweight weight-tracking editor with native GUI"
authors = ["OpenΦ Community"]
license = "MIT"

[dependencies]
eframe = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
csv = "1.3"
rfd = "0.14"

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
